  role="img" aria-label="Moningi Rohit — profile.sh --live">

<defs>
  <!-- Animated accent gradient -->
  <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6D28D9"><animate attributeName="stop-color" values="#6D28D9;#0891B2;#059669;#6D28D9" dur="10s" repeatCount="indefinite"/></stop>
    <stop offset="0.5" stop-color="#0891B2"><animate attributeName="stop-color" values="#0891B2;#059669;#6D28D9;#0891B2" dur="10s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#059669"><animate attributeName="stop-color" values="#059669;#6D28D9;#0891B2;#059669" dur="10s" repeatCount="indefinite"/></stop>
  </linearGradient>

  <!-- Portrait dot gradient — animated -->
  <linearGradient id="dotGradL" x1="0" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#7C3AED"/>
    <stop offset="0.45" stop-color="#4F46E5"/>
    <stop offset="1" stop-color="#0891B2"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 -120; 0 120; 0 -120" dur="9s" repeatCount="indefinite"/>
  </linearGradient>

  <!-- Panel gradients -->
  <linearGradient id="panelGradL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F8FAFC"/>
    <stop offset="1" stop-color="#F1F5F9"/>
  </linearGradient>

  <!-- Filters -->
  <filter id="glow8L" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <filter id="glow3L" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <filter id="txtGlowL" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="0.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="panelShadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(99,102,241,0.12)"/>
  </filter>

  <!-- Clip path -->
  <clipPath id="winClipL">
    <rect x="2" y="2" width="1176" height="606" rx="18"/>
  </clipPath>

  <!-- Subtle dot grid -->
  <pattern id="dotGridL" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#6D28D9" opacity="0.025"/>
  </pattern>
</defs>

<!-- Terminal window base -->
<rect x="2" y="2" width="1176" height="606" rx="18" fill="#E2E8F0" filter="url(#panelShadow)"/>

