<svg xmlns="http://www.w3.org/2000/svg" width="170" height="50" viewBox="0 0 170 50">
    <defs>
        <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7C3AED" />
            <stop offset="100%" stop-color="#0891B2" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <style>
            .link-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #475569; font-weight: 600; letter-spacing: 1px; transition: fill 0.3s ease; }
            .icon { color: #475569; transition: color 0.3s ease; }
            .bg-glow { opacity: 0; transition: opacity 0.3s ease; }
            .border { stroke: rgba(8,145,178,0.2); transition: stroke 0.3s ease; }
            .cursor-dot { opacity: 0; transition: opacity 0.3s ease; }
            
            /* Native SVG Hover Interactions */
            .btn:hover .link-text { fill: #0F172A; }
            .btn:hover .icon { color: #0F172A; }
            .btn:hover .bg-glow { opacity: 0.15; }
            .btn:hover .border { stroke: #0891B2; }
            .btn:hover .cursor-dot { opacity: 1; }
        </style>
    </defs>

    <g class="btn">
        <!-- Background glow when active/hovered -->
        <rect x="5" y="5" width="160" height="36" rx="6" fill="#0891B2" class="bg-glow" />
        
        <!-- Border -->
        <rect x="5" y="5" width="160" height="36" rx="6" fill="transparent" stroke-width="1" class="border" />
        
        <!-- Icon -->
        <svg x="20" y="11" width="24" height="24" viewBox="0 0 24 24" class="icon">
            <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.03-2.682-.103-.253-.447-1.27.098-2.646 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.376.202 2.394.1 2.646.64.699 1.026 1.591 1.026 2.682 0 3.841-2.337 4.687-4.565 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z" fill="currentColor"/>
        </svg>
        
        <!-- Text -->
        <text x="50" y="27" class="link-text">GITHUB</text>
        
        <!-- Animated underline that draws in -->
        <rect x="15" y="39" width="0" height="2" fill="url(#accent)">
            <animate attributeName="width" from="0" to="140" begin="0.2s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
        </rect>
        
        <!-- Interactive Hover Cursor Dot -->
        <circle cx="0" cy="40" r="3" fill="#0891B2" filter="url(#glow)" class="cursor-dot">
            <animate attributeName="cx" values="15; 155; 15" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>
    </g>
</svg>