<svg xmlns="http://www.w3.org/2000/svg" width="170" height="50" viewBox="0 0 170 50">
    <defs>
        <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7C3AED" />
            <stop offset="100%" stop-color="#22D3EE" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <style>
            .link-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #94A3B8; font-weight: 600; letter-spacing: 1px; transition: fill 0.3s ease; }
            .icon { color: #94A3B8; transition: color 0.3s ease; }
            .bg-glow { opacity: 0; transition: opacity 0.3s ease; }
            .border { stroke: rgba(34,211,238,0.2); transition: stroke 0.3s ease; }
            .cursor-dot { opacity: 0; transition: opacity 0.3s ease; }
            
            /* Native SVG Hover Interactions */
            .btn:hover .link-text { fill: #F8FAFC; }
            .btn:hover .icon { color: #F8FAFC; }
            .btn:hover .bg-glow { opacity: 0.15; }
            .btn:hover .border { stroke: #22D3EE; }
            .btn:hover .cursor-dot { opacity: 1; }
        </style>
    </defs>

    <g class="btn">
        <!-- Background glow when active/hovered -->
        <rect x="5" y="5" width="160" height="36" rx="6" fill="#22D3EE" class="bg-glow" />
        
        <!-- Border -->
        <rect x="5" y="5" width="160" height="36" rx="6" fill="transparent" stroke-width="1" class="border" />
        
        <!-- Icon -->
        <svg x="20" y="11" width="24" height="24" viewBox="0 0 24 24" class="icon">
            <circle cx="12" cy="12" r="9" stroke="currentColor" fill="none" stroke-width="2"/><ellipse cx="12" cy="12" rx="4" ry="9" stroke="currentColor" fill="none" stroke-width="2"/><path d="M3 12h18" stroke="currentColor" fill="none" stroke-width="2"/>
        </svg>
        
        <!-- Text -->
        <text x="50" y="27" class="link-text">PORTFOLIO</text>
        
        <!-- Animated underline that draws in -->
        <rect x="15" y="39" width="0" height="2" fill="url(#accent)">
            <animate attributeName="width" from="0" to="140" begin="0.6000000000000001s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
        </rect>
        
        <!-- Interactive Hover Cursor Dot -->
        <circle cx="0" cy="40" r="3" fill="#22D3EE" filter="url(#glow)" class="cursor-dot">
            <animate attributeName="cx" values="15; 155; 15" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
        </circle>
    </g>
</svg>