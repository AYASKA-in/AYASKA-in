<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="60" viewBox="0 0 1180 60">
    <defs>
        <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7C3AED" />
            <stop offset="100%" stop-color="#22D3EE" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <style>
            .link-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #94A3B8; font-weight: 600; letter-spacing: 1px; transition: fill 0.3s; }
            .btn:hover .link-text { fill: #F8FAFC; }
            .btn { cursor: pointer; }
            .icon { color: #94A3B8; transition: color 0.3s; }
            .btn:hover .icon { color: #F8FAFC; }
        </style>
    </defs>
    
    <!-- Top accent line -->
    <rect x="0" y="0" width="100%" height="1" fill="url(#accent)"/>
    
    <!-- Cursor Dot -->
    <circle r="3" fill="#22D3EE" filter="url(#glow)">
        <animateMotion dur="12s" repeatCount="indefinite" calcMode="spline"
            keyTimes="0;0.22;0.25;0.47;0.5;0.72;0.75;0.97;1"
            keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
            path="M 320.0 55 L 320.0 55 L 500.0 55 L 500.0 55 L 680.0 55 L 680.0 55 L 860.0 55 L 860.0 55 L 320.0 55" />
    </circle>

    <g class="btn">
        <a href="https://www.linkedin.com/in/moningi-rohit/" target="_blank">
            <rect x="240.0" y="12" width="160" height="36" rx="6" fill="transparent" stroke="rgba(34,211,238,0.2)" stroke-width="1"/>
            <svg x="255.0" y="18" width="24" height="24" viewBox="0 0 24 24" class="icon">
                <rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8 11v6M8 8v.01M12 17v-4a2 2 0 0 1 4 0v4M12 11h4" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/>
                <animate attributeName="color" values="#F8FAFC; #F8FAFC; #94A3B8; #94A3B8; #94A3B8; #94A3B8" keyTimes="0; 0.24; 0.25; 0.75; 0.99; 1" dur="12s" repeatCount="indefinite" />
            </svg>
            <text x="285.0" y="34" class="link-text">
                LINKEDIN
                <animate attributeName="fill" values="#F8FAFC; #F8FAFC; #94A3B8; #94A3B8; #94A3B8; #94A3B8" keyTimes="0; 0.24; 0.25; 0.75; 0.99; 1" dur="12s" repeatCount="indefinite" />
            </text>
            <!-- Animated underline -->
            <rect x="320.0" y="46" width="0" height="2" fill="url(#accent)">
                <animate attributeName="width" from="0" to="140" begin="0.3s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
                <animate attributeName="x" from="320.0" to="250.0" begin="0.3s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
            </rect>
        </a>
    </g>

    <g class="btn">
        <a href="https://github.com/AYASKA-in" target="_blank">
            <rect x="420.0" y="12" width="160" height="36" rx="6" fill="transparent" stroke="rgba(34,211,238,0.2)" stroke-width="1"/>
            <svg x="435.0" y="18" width="24" height="24" viewBox="0 0 24 24" class="icon">
                <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.03-2.682-.103-.253-.447-1.27.098-2.646 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.376.202 2.394.1 2.646.64.699 1.026 1.591 1.026 2.682 0 3.841-2.337 4.687-4.565 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z" fill="currentColor"/>
                <animate attributeName="color" values="#94A3B8; #94A3B8; #F8FAFC; #F8FAFC; #94A3B8; #94A3B8" keyTimes="0; 0.24; 0.25; 0.49; 0.5; 1" dur="12s" repeatCount="indefinite" />
            </svg>
            <text x="465.0" y="34" class="link-text">
                GITHUB
                <animate attributeName="fill" values="#94A3B8; #94A3B8; #F8FAFC; #F8FAFC; #94A3B8; #94A3B8" keyTimes="0; 0.24; 0.25; 0.49; 0.5; 1" dur="12s" repeatCount="indefinite" />
            </text>
            <!-- Animated underline -->
            <rect x="500.0" y="46" width="0" height="2" fill="url(#accent)">
                <animate attributeName="width" from="0" to="140" begin="0.5s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
                <animate attributeName="x" from="500.0" to="430.0" begin="0.5s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
            </rect>
        </a>
    </g>

    <g class="btn">
        <a href="mailto:rohitmoningi@gmail.com" target="_blank">
            <rect x="600.0" y="12" width="160" height="36" rx="6" fill="transparent" stroke="rgba(34,211,238,0.2)" stroke-width="1"/>
            <svg x="615.0" y="18" width="24" height="24" viewBox="0 0 24 24" class="icon">
                <path d="M3 7l9 6 9-6" stroke="currentColor" fill="none" stroke-width="2" stroke-linejoin="round"/><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" fill="none" stroke-width="2"/>
                <animate attributeName="color" values="#94A3B8; #94A3B8; #F8FAFC; #F8FAFC; #94A3B8; #94A3B8" keyTimes="0; 0.49; 0.5; 0.74; 0.75; 1" dur="12s" repeatCount="indefinite" />
            </svg>
            <text x="645.0" y="34" class="link-text">
                EMAIL
                <animate attributeName="fill" values="#94A3B8; #94A3B8; #F8FAFC; #F8FAFC; #94A3B8; #94A3B8" keyTimes="0; 0.49; 0.5; 0.74; 0.75; 1" dur="12s" repeatCount="indefinite" />
            </text>
            <!-- Animated underline -->
            <rect x="680.0" y="46" width="0" height="2" fill="url(#accent)">
                <animate attributeName="width" from="0" to="140" begin="0.7s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
                <animate attributeName="x" from="680.0" to="610.0" begin="0.7s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
            </rect>
        </a>
    </g>

    <g class="btn">
        <a href="https://rohitmoningi.in" target="_blank">
            <rect x="780.0" y="12" width="160" height="36" rx="6" fill="transparent" stroke="rgba(34,211,238,0.2)" stroke-width="1"/>
            <svg x="795.0" y="18" width="24" height="24" viewBox="0 0 24 24" class="icon">
                <circle cx="12" cy="12" r="9" stroke="currentColor" fill="none" stroke-width="2"/><ellipse cx="12" cy="12" rx="4" ry="9" stroke="currentColor" fill="none" stroke-width="2"/><path d="M3 12h18" stroke="currentColor" fill="none" stroke-width="2"/>
                <animate attributeName="color" values="#94A3B8; #94A3B8; #94A3B8; #94A3B8; #F8FAFC; #F8FAFC" keyTimes="0; 0.25; 0.74; 0.75; 0.99; 1" dur="12s" repeatCount="indefinite" />
            </svg>
            <text x="825.0" y="34" class="link-text">
                PORTFOLIO
                <animate attributeName="fill" values="#94A3B8; #94A3B8; #94A3B8; #94A3B8; #F8FAFC; #F8FAFC" keyTimes="0; 0.25; 0.74; 0.75; 0.99; 1" dur="12s" repeatCount="indefinite" />
            </text>
            <!-- Animated underline -->
            <rect x="860.0" y="46" width="0" height="2" fill="url(#accent)">
                <animate attributeName="width" from="0" to="140" begin="0.9s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
                <animate attributeName="x" from="860.0" to="790.0" begin="0.9s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
            </rect>
